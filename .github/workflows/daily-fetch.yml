name: 🇩🇪 Daily German News Fetch

on:
  schedule:
    # Daily at 00:00 UTC (08:00 BJT)
    - cron: '30 0 * * *'
  workflow_dispatch:  # manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests lxml

      - name: Fetch German news
        run: python .github/scripts/fetch-news.py

      - name: Commit and push
        run: |
          git config user.name "Ariste News Bot"
          git config user.email "aristebot@users.noreply.github.com"
          git add -A
          # Only commit if there are changes (new data)
          git diff --quiet && git diff --staged --quiet || git commit -m "📰 German news update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
