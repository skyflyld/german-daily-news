name: Lithium Data Fetch

on:
  # schedule:
  #   - cron: '0 2,14 * * 1-5'   # 停用: Sky 2026-07-05 指令不再自动运行
  workflow_dispatch:

jobs:
  fetch-lithium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Fetch & compile lithium data
        run: python3 .github/scripts/fetch-lithium-data.py
      
      - name: Commit & push
        run: |
          git config user.name "german-daily-news[bot]"
          git config user.email "bot@skyflyld.com"
          git add lithium-data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "lithium-data: $(date +'%Y-%m-%dT%H:%M')"
            git push
          fi
